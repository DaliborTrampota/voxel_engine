name: Static analysis

permissions:
  pull-requests: write
  contents: read


on: 
  pull_request:
    branches: [ "master" ]

jobs:
  static-check:
    name: Static analysis Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Check commit message and exit if needed
      run: |
        MSG=$(git log -1 --pretty=%B)
        echo "Commit message: $MSG"
        if [[ "$MSG" != *cppcheck* ]]; then
            echo "No 'cppcheck' in commit message. Skipping job."
            exit 0
        fi

    - name: Configure CMake
      run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DUSE_DEPENDENCIES=OFF -B build -S .

    - name: Install cppcheck
      run: sudo apt-get install -y cppcheck
      
    - name: Run cppcheck
      run: |
        cppcheck --enable=all \
                --inconclusive \
                --std=c++20 \
                --quiet \
                --suppress=missingIncludeSystem \
                --project=build/compile_commands.json 2> cppcheck_result.txt
        cat cppcheck_result.txt

    - name: Parse cppcheck result
      run: node .github/scripts/postCPPCheck.js > cppcheck_comment.txt
      env:
        OUTPUT: cppcheck_result.txt

    - name: Post comment on PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
            const fs = require('fs');
            const comment = fs.readFileSync('cppcheck_comment.txt', 'utf8').trim();
            if (!comment) return;
            await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment.slice(0, 6000),
            });