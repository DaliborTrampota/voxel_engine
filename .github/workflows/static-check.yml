name: Static analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  static-check:
    name: Static analysis Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    
    - name: Configure CMake
      run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_GLFW=OFF -B build -S .

    - name: Install cppcheck
      run: sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: cppcheck --enable=all --inconclusive --std=c++20 --quiet --project=build/compile_commands.json --exclude=dependencies
