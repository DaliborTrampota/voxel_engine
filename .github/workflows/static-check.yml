name: Static analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  static-check:
    name: Static analysis Check
    runs-on: ubuntu-latest
    steps:
    - name: Install cppcheck
      run: sudo apt-get install cppcheck

    - name: Run cppcheck on engine
      run: cppcheck --enable=all --inconclusive --std=c++20 --quiet engine/
      
    - name: Run cppcheck on game
      run: cppcheck --enable=all --inconclusive --std=c++20 --quiet game/